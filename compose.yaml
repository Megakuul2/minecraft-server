# Minecraft-Server (Java Edition, Paper) mit automatischen Backups
# Einstellungen wie Spielernamen und RAM stehen in der Datei .env

services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    pull_policy: daily
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "${MC_VERSION:-LATEST}"
      MEMORY: "${MC_MEMORY:-4G}"
      TZ: Europe/Zurich
      MOTD: "${MC_MOTD:-Minecraft Server}"
      DIFFICULTY: "${MC_DIFFICULTY:-normal}"
      MAX_PLAYERS: "${MC_MAX_PLAYERS:-10}"
      VIEW_DISTANCE: "10"
      # Whitelist: nur eingetragene Spieler kommen rein
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      WHITELIST: "${MC_WHITELIST:-}"
      OPS: "${MC_OPS:-}"
      # RCON nur intern fuer Backups und Konsole, Port wird nicht veroeffentlicht
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${RCON_PASSWORD:?RCON_PASSWORD fehlt in .env}"
    volumes:
      - ./data:/data
    restart: unless-stopped

  backup:
    image: itzg/mc-backup:latest
    container_name: minecraft-backup
    depends_on:
      - mc
    environment:
      BACKUP_INTERVAL: "24h"
      INITIAL_DELAY: "10m"
      PRUNE_BACKUPS_DAYS: "7"
      RCON_HOST: mc
      RCON_PASSWORD: "${RCON_PASSWORD:?RCON_PASSWORD fehlt in .env}"
      TZ: Europe/Zurich
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    restart: unless-stopped
